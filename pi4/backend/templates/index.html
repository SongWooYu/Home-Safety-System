<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home Safety</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1018;--panel:#151d29;--line:#2a3749;--text:#edf3fb;--muted:#9aa8ba;--green:#36d17c;--red:#ff6374;--blue:#6aa9ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
    header,main{max-width:1600px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}
    h1,h2{margin:0}.alarm,.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;margin-bottom:18px}
    .panel h2{margin-bottom:12px}.panel h2 small{font-size:12px;font-weight:400;margin-left:8px;color:var(--muted)}
    .alarm.active{border-color:var(--red);box-shadow:0 0 0 2px #ff637444}.alarm strong{font-size:22px}.muted{color:var(--muted)}
    .grid,.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.camera,.event,.vision-card{background:#101720;border-radius:9px;padding:12px}
    .vision-card{overflow:hidden}.vision-card strong{display:block;margin-bottom:8px}.vision-stream{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#05070a;border-radius:6px}
    .stream-meta{margin-top:7px}.online{color:var(--green)}.offline{color:var(--red)}.events{display:grid;gap:8px;max-height:480px;overflow:auto}
    .event{display:grid;grid-template-columns:150px 110px 1fr;gap:10px}input,button{padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:#101720;color:var(--text)}
    button{background:#9a2938;cursor:pointer}.alarm-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.test-button{background:#9a5a16}.tts-button{background:#28639a}.cancel-button{background:#9a2938}
    .volume-control{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);border-radius:8px}.volume-control input{padding:0;width:150px}.volume-control output{min-width:42px;text-align:right}
    @media(max-width:650px){.event{grid-template-columns:1fr}header{display:block}.grid,.video-grid{grid-template-columns:1fr}.alarm-controls>*{width:100%}.volume-control input{width:100%}}
  </style>
</head>
<body>
  <header><h1>Home Safety</h1><span id="updated" class="muted">서버 연결 중…</span></header>
  <main>
    <section id="alarm" class="alarm">
      <strong id="alarm-title">안전 상태 확인 중</strong>
      <p id="alarm-detail" class="muted">Pi5 이벤트와 Pi4 자동화 상태를 기다립니다.</p>
      <div class="alarm-controls">
        <input id="admin-token" type="password" autocomplete="off" placeholder="관리 키">
        <button id="test-tts" class="tts-button" type="button">TTS 음성 1회 시험</button>
        <button id="test-alarm" class="test-button" type="button">시험 낙상 경보 발생</button>
        <button id="cancel" class="cancel-button" type="button">낙상 경보 해제</button>
        <label class="volume-control">
          스피커 음량
          <input id="alarm-volume" type="range" min="0" max="100" step="5" value="70">
          <output id="alarm-volume-value">70%</output>
        </label>
        <span id="action-message" class="muted"></span>
      </div>
      <p class="muted">TTS 시험은 안전 상태를 바꾸지 않고 음성만 한 번 재생합니다. 시험 경보는 경고음과 음성을 반복하므로 확인 후 해제해 주세요.</p>
    </section>
    <section class="panel">
      <h2>AI 분석 영상 <small id="vision-state">Pi5 연결 확인 중…</small></h2>
      <div class="video-grid">
        {% for camera_id in vision_cameras %}
        <article class="vision-card">
          <strong id="video-name-{{ camera_id }}">{{ camera_id }}</strong>
          <iframe
            class="vision-stream"
            data-camera-id="{{ camera_id }}"
            src="{{ webrtc_base_url }}/{{ webrtc_paths.get(camera_id, camera_id) }}?controls=false&muted=true&autoplay=true&playsInline=true"
            title="{{ camera_id }} 실시간 영상"
            allow="autoplay; fullscreen; picture-in-picture"
          ></iframe>
          <div id="video-meta-{{ camera_id }}" class="stream-meta muted">영상 연결 중…</div>
        </article>
        {% endfor %}
      </div>
    </section>
    <section class="panel">
      <h2>카메라 상태</h2>
      <div id="cameras" class="grid"><p class="muted">상태 수신 대기 중…</p></div>
    </section>
    <section class="panel">
      <h2>최근 안전 이벤트</h2>
      <div id="events" class="events"><p class="muted">이벤트 수신 대기 중…</p></div>
    </section>
  </main>
<script>
  const token = document.getElementById('admin-token');
  const alarmVolume = document.getElementById('alarm-volume');
  const alarmVolumeValue = document.getElementById('alarm-volume-value');
  token.value = sessionStorage.getItem('pi4AdminToken') || '';
  alarmVolume.value = sessionStorage.getItem('pi4AlarmVolume') || '70';
  alarmVolumeValue.value = alarmVolume.value + '%';
  token.addEventListener('change',()=>sessionStorage.setItem('pi4AdminToken',token.value.trim()));
  const labels = {person_detected:'사람 감지',person_cleared:'사람 없음',fall_suspected:'낙상 의심',fall_confirmed:'낙상 확인',fall_cleared:'낙상 해제'};
  let lastStreamRestart = 0;

  function make(tag, text, className='') {
    const node=document.createElement(tag); node.textContent=text; node.className=className; return node;
  }

  function restartAllStreams() {
    const now=Date.now();
    if(now-lastStreamRestart<1000)return;
    lastStreamRestart=now;
    document.querySelectorAll('.vision-stream').forEach(frame=>{
      const current=frame.src;
      frame.src='about:blank';
      setTimeout(()=>{frame.src=current;},100);
    });
  }
  document.querySelectorAll('.vision-stream').forEach(frame=>{
    frame.addEventListener('load',()=>{
      if(frame.src==='about:blank')return;
      const meta=document.getElementById(`video-meta-${frame.dataset.cameraId}`);
      if(meta)meta.textContent='Pi5 WebRTC 직접 연결';
    });
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible')setTimeout(restartAllStreams,250);
  });
  window.addEventListener('pageshow',restartAllStreams);
  window.addEventListener('online',restartAllStreams);

  function render(data) {
    document.getElementById('updated').textContent='마지막 확인 '+new Date().toLocaleTimeString('ko-KR');
    const state=data.fall?.status?.state || 'normal';
    const active=state==='alarm';
    const alarm=document.getElementById('alarm'); alarm.classList.toggle('active',active);
    document.getElementById('alarm-title').textContent=active?'낙상 위험 경보':'현재 경보 없음';
    document.getElementById('alarm-detail').textContent=active
      ? `${data.fall.status.camera_id || '카메라'}에서 낙상 위험을 감지했습니다.`
      : `상태: ${state}`;

    const cameras=document.getElementById('cameras'); cameras.replaceChildren();
    for (const item of data.cameras) {
      const box=make('div','', 'camera');
      const status=item.status || {};
      const online=status.online !== false && Date.now()-Date.parse(item.updated_at)<15000;
      box.append(make('strong',status.label || item.camera_id));
      box.append(make('div',online?'온라인':'상태 지연',online?'online':'offline'));
      const faceNames=[...new Set((status.recognized_faces || [])
        .filter(face=>face.registered)
        .map(face=>face.name))];
      const unknownFaces=Number(status.unknown_faces || 0);
      let detectionSummary='사람 '+(status.person_count || 0)+'명';
      if(faceNames.length || unknownFaces){
        const identities=faceNames.slice();
        if(unknownFaces)identities.push('미등록 '+unknownFaces+'명');
        detectionSummary='얼굴 '+identities.join(' · ');
      }
      box.append(make('div',detectionSummary+' · 낙상 '+(status.fall_state || 'normal'),'muted'));
      cameras.append(box);
      const videoName=document.getElementById(`video-name-${item.camera_id}`);
      if(videoName)videoName.textContent=status.label || item.camera_id;
      const videoMeta=document.getElementById(`video-meta-${item.camera_id}`);
      if(videoMeta && !online)videoMeta.textContent='카메라 상태 지연 · 영상 재연결 대기';
    }
    if (!data.cameras.length) cameras.append(make('p','상태 수신 대기 중…','muted'));

    const events=document.getElementById('events'); events.replaceChildren();
    for (const item of data.events) {
      const row=make('div','', 'event');
      row.append(make('time',new Date(item.timestamp).toLocaleString('ko-KR'),'muted'));
      row.append(make('strong',item.camera_id));
      const confidence=item.confidence==null?'':` · ${Math.round(item.confidence*100)}%`;
      row.append(make('span',(labels[item.event_type] || item.event_type)+confidence));
      events.append(row);
    }
    if (!data.events.length) events.append(make('p','이벤트 수신 대기 중…','muted'));
  }
  async function refresh() {
    try {
      const response=await fetch('/api/overview',{cache:'no-store'});
      if (!response.ok) throw new Error('서버 응답 오류');
      render(await response.json());
    } catch (error) {
      document.getElementById('updated').textContent='서버 재연결 중…';
    }
  }
  async function refreshVisionHealth() {
    const state=document.getElementById('vision-state');
    try {
      const response=await fetch('/api/vision/health',{cache:'no-store'});
      if(!response.ok)throw new Error();
      const data=await response.json();
      state.textContent=`Pi5 연결 · ${data.upstream.online_cameras || 0}대 온라인`;
    } catch(error) {
      state.textContent='Pi5 영상 연결 끊김 · 자동 재시도';
    }
  }
  async function alarmRequest(path, body=null) {
    const isAudio=path==='/api/alarm/tts-test' || path==='/api/alarm/volume';
    const supplied=token.value.trim();
    if(!isAudio)sessionStorage.setItem('pi4AdminToken',supplied);
    const options={method:'POST',headers:isAudio?{}:{'X-Admin-Token':supplied}};
    if(body!==null){
      options.headers['Content-Type']='application/json';
      options.body=JSON.stringify(body);
    }
    const response=await fetch(path,options);
    const data=await response.json();
    if(!response.ok)throw new Error(data.error || '요청 실패');
    return data;
  }

  document.getElementById('test-alarm').addEventListener('click',async()=>{
    const message=document.getElementById('action-message');
    if(!confirm('Pi4 스피커에서 실제 경보음과 음성을 재생할까요?'))return;
    try {
      await alarmRequest('/api/alarm/test');
      message.textContent='시험 낙상 경보를 발생시켰습니다.';
      setTimeout(refresh,300);
    } catch(error) { message.textContent=error.message; }
  });

  document.getElementById('test-tts').addEventListener('click',async()=>{
    const message=document.getElementById('action-message');
    try {
      await alarmRequest('/api/alarm/tts-test');
      message.textContent='Pi4에 TTS 1회 재생 명령을 전송했습니다.';
    } catch(error) { message.textContent=error.message; }
  });

  document.getElementById('cancel').addEventListener('click',async()=>{
    const message=document.getElementById('action-message');
    try {
      await alarmRequest('/api/alarm/cancel');
      message.textContent='낙상 경보를 해제했습니다.';
      setTimeout(refresh,300);
    } catch(error) { message.textContent=error.message; }
  });

  alarmVolume.addEventListener('input',()=>{
    alarmVolumeValue.value=alarmVolume.value+'%';
  });
  alarmVolume.addEventListener('change',async()=>{
    const message=document.getElementById('action-message');
    const volume=Number(alarmVolume.value);
    try {
      await alarmRequest('/api/alarm/volume',{volume});
      sessionStorage.setItem('pi4AlarmVolume',String(volume));
      message.textContent='스피커 음량을 '+volume+'%로 설정했습니다.';
    } catch(error) { message.textContent=error.message; }
  });
  refresh();
  refreshVisionHealth();
  setInterval(refresh,2000);
  setInterval(refreshVisionHealth,5000);
</script>
</body>
</html>
