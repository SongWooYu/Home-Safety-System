<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home Safety</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1018;--panel:#151d29;--line:#2a3749;--text:#edf3fb;--muted:#9aa8ba;--green:#36d17c;--red:#ff6374;--blue:#6aa9ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
    header,main{max-width:1200px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}
    h1,h2{margin:0}.alarm,.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;margin-bottom:18px}
    .alarm.active{border-color:var(--red);box-shadow:0 0 0 2px #ff637444}.alarm strong{font-size:22px}.muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.camera,.event{background:#101720;border-radius:9px;padding:12px}
    .online{color:var(--green)}.offline{color:var(--red)}.events{display:grid;gap:8px;max-height:480px;overflow:auto}
    .event{display:grid;grid-template-columns:150px 110px 1fr;gap:10px}input,button{padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:#101720;color:var(--text)}
    button{background:#9a2938;cursor:pointer}@media(max-width:650px){.event{grid-template-columns:1fr}header{display:block}}
  </style>
</head>
<body>
  <header><h1>Home Safety</h1><span id="updated" class="muted">서버 연결 중…</span></header>
  <main>
    <section id="alarm" class="alarm">
      <strong id="alarm-title">안전 상태 확인 중</strong>
      <p id="alarm-detail" class="muted">Pi5 이벤트와 Pi4 자동화 상태를 기다립니다.</p>
      <input id="admin-token" type="password" autocomplete="off" placeholder="관리 키">
      <button id="cancel" type="button">경보 확인·취소</button>
      <span id="action-message" class="muted"></span>
    </section>
    <section class="panel">
      <h2>카메라 상태</h2>
      <div id="cameras" class="grid"><p class="muted">상태 수신 대기 중…</p></div>
    </section>
    <section class="panel">
      <h2>최근 안전 이벤트</h2>
      <div id="events" class="events"><p class="muted">이벤트 수신 대기 중…</p></div>
    </section>
  </main>
<script>
  const token = document.getElementById('admin-token');
  token.value = sessionStorage.getItem('pi4AdminToken') || '';
  const labels = {person_detected:'사람 감지',person_cleared:'사람 없음',fall_suspected:'낙상 의심',fall_confirmed:'낙상 확인',fall_cleared:'낙상 해제'};

  function make(tag, text, className='') {
    const node=document.createElement(tag); node.textContent=text; node.className=className; return node;
  }
  function render(data) {
    document.getElementById('updated').textContent='마지막 확인 '+new Date().toLocaleTimeString('ko-KR');
    const state=data.fall?.status?.state || 'normal';
    const active=state==='alarm';
    const alarm=document.getElementById('alarm'); alarm.classList.toggle('active',active);
    document.getElementById('alarm-title').textContent=active?'낙상 위험 경보':'현재 경보 없음';
    document.getElementById('alarm-detail').textContent=active
      ? `${data.fall.status.camera_id || '카메라'}에서 낙상 위험을 감지했습니다.`
      : `상태: ${state}`;

    const cameras=document.getElementById('cameras'); cameras.replaceChildren();
    for (const item of data.cameras) {
      const box=make('div','', 'camera');
      const status=item.status || {};
      const online=status.online !== false && Date.now()-Date.parse(item.updated_at)<15000;
      box.append(make('strong',status.label || item.camera_id));
      box.append(make('div',online?'온라인':'상태 지연',online?'online':'offline'));
      box.append(make('div',`사람 ${status.person_count || 0}명 · 낙상 ${status.fall_state || 'normal'}`,'muted'));
      cameras.append(box);
    }
    if (!data.cameras.length) cameras.append(make('p','상태 수신 대기 중…','muted'));

    const events=document.getElementById('events'); events.replaceChildren();
    for (const item of data.events) {
      const row=make('div','', 'event');
      row.append(make('time',new Date(item.timestamp).toLocaleString('ko-KR'),'muted'));
      row.append(make('strong',item.camera_id));
      const confidence=item.confidence==null?'':` · ${Math.round(item.confidence*100)}%`;
      row.append(make('span',(labels[item.event_type] || item.event_type)+confidence));
      events.append(row);
    }
    if (!data.events.length) events.append(make('p','이벤트 수신 대기 중…','muted'));
  }
  async function refresh() {
    try {
      const response=await fetch('/api/overview',{cache:'no-store'});
      if (!response.ok) throw new Error('서버 응답 오류');
      render(await response.json());
    } catch (error) {
      document.getElementById('updated').textContent='서버 재연결 중…';
    }
  }
  document.getElementById('cancel').addEventListener('click',async()=>{
    const supplied=token.value.trim(); sessionStorage.setItem('pi4AdminToken',supplied);
    const message=document.getElementById('action-message');
    try {
      const response=await fetch('/api/alarm/cancel',{method:'POST',headers:{'X-Admin-Token':supplied}});
      const data=await response.json();
      if(!response.ok) throw new Error(data.error || '요청 실패');
      message.textContent='취소 명령을 전송했습니다.';
      setTimeout(refresh,300);
    } catch(error) { message.textContent=error.message; }
  });
  refresh(); setInterval(refresh,2000);
</script>
</body>
</html>
