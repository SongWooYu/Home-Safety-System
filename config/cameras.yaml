server:
  host: 0.0.0.0
  port: 8080

  # 사용자에게 보여주는 MJPEG 화면
  stream_width: 640
  stream_height: 360
  stream_fps: 15
  jpeg_quality: 70


mqtt:
  enabled: true
  host: 192.168.1.10
  port: 1883

  topic_events: home/vision/events
  topic_status_prefix: home/vision/status

  status_interval_seconds: 5


# Legacy object detector configuration.
#
# 현재 fall runtime에서는 별도 object detector를
# 생성하지 않는다.
#
# Pose model이 person bbox와 keypoint를
# 동시에 제공한다.
inference:
  backend: ncnn
  model: models/yolo11n_ncnn_model

  input_size: 320
  confidence: 0.35
  nms_iou: 0.45
  threads: 4


face_recognition:
  enabled: true

  admin_token: ${FACE_ADMIN_TOKEN}

  detector_model:
    runtime/models/face/face_detection_yunet_2023mar.onnx

  recognizer_model:
    runtime/models/face/face_recognition_sface_2021dec.onnx

  database:
    data/faces.json

  # 얼굴 인식은 계속 실행할 필요 없음.
  analysis_fps: 0.5

  match_threshold: 0.45
  detection_width: 640
  min_face_size: 70


fall_detection:
  enabled: true

  # ncnn: 현재 운영값. hailo는 live coverage 검증 후 수동 전환한다.
  backend: ncnn

  # Pi5 CPU pre-Hailo baseline.
  # 640 export는 전체 서비스에서 약 7.9 FPS,
  # 960 export는 단독으로 약 5.4 FPS라 현재 사용할 수 없다.
  model:
    models/yolo11n-pose_ncnn_model

  hailo_model:
    /usr/local/hailo/resources/models/hailo8/yolov8m_pose.hef

  hailo_postprocess:
    /usr/local/hailo/resources/so/libyolov8pose_postprocess.so

  hailo_whole_buffer:
    /usr/lib/aarch64-linux-gnu/hailo/tappas/post_processes/cropping_algorithms/libwhole_buffer.so

  hailo_timeout_seconds: 3.0

  # Pi5 개발 대시보드용 동일 프레임 비교.
  # NCNN이 Rule/GRU/MQTT를 계속 담당하며 Hailo 결과는 화면과 계측에만 쓴다.
  # overlay stream을 보는 동안에만 실행하여 평상시 Hailo/복사 부하를 없앤다.
  hailo_shadow:
    enabled: true
    run_when_viewed: true
    analysis_fps: 15
    # EdgeFallKit의 Hailo 시간 모델과 동일한 Model Zoo v2.15 입력 도메인.
    # runtime/은 Git 제외 영역이며 setup 문서의 SHA-256으로 검증한다.
    model:
      runtime/models/yolov8s_pose_v2_15_h8.hef
    confidence: 0.0
    keypoint_confidence: 0.25
    edgefall:
      enabled: true
      library: runtime/native/libedgefall_shadow.so
      keypoint_confidence: 0.25

  input_size: 320

  # 현재 320 export의 score calibration.
  confidence: 0.10

  nms_iou: 0.45

  # Pi5 benchmark에서 4 thread가
  # 가장 빨랐음.
  threads: 4

  # 최종 GRU temporal sampling rate.
  analysis_fps: 10

  keypoint_confidence: 0.25

  # 아래 값은 현재 RuleFallDetector fallback용.
  transition_window: 3.0
  confirm_seconds: 1.2
  recovery_seconds: 2.0

  # active: MQTT 경보 전송, shadow: 로컬 진단만 수행.
  # 안전 기능 변경은 사용자 승인 후에만 shadow로 전환한다.
  rule:
    mode: active

  # B_76_sqrt 3-seed GRU.
  #
  # 현재는 기존 RuleFallDetector와
  # 동시에 실행하는 shadow mode이며
  # MQTT fall event에는 관여하지 않는다.
  temporal:
    enabled: true
    mode: shadow

    model:
      models/fall_gru/b76_sqrt_ensemble/numpy

    sequence_length: 20
    sample_fps: 10
    keypoint_confidence: 0.25

    # Quiet development profile: 순간 spike보다 4프레임 지속성을 우선한다.
    # 실제 전시장 검증 전까지 shadow 결과만 생성한다.
    threshold: 0.89
    consecutive: 4

    max_missing_frames: 10
    expire_seconds: 1.5
    release_frames: 3
    cooldown_seconds: 5.0

    # 진단용 메타데이터이며 아직 경보 차단 조건으로 쓰지 않는다.
    quality_min_visible_ratio: 0.35
    quality_min_valid_frame_ratio: 0.75
    quality_edge_margin_ratio: 0.01

    # 원본 영상/얼굴은 저장하지 않는다. JSONL 한 세대만 순환 보관한다.
    observation_log:
      enabled: true
      path: runtime/fall-shadow-observations-quiet.jsonl
      interval_seconds: 1.0
      max_bytes: 20971520


cameras:

  # --------------------------------------------------
  # Camera Module 3
  #
  # Face enrollment / recognition station and secondary view.
  # --------------------------------------------------
  - id: cam3

    label:
      Camera Module 3

    type:
      picamera2

    enabled: true

    ai_enabled: true

    fall_detection: false

    face_recognition: true

    face_enrollment: true

    width: 960
    height: 540

    # 화면용으로 15 FPS면 충분.
    fps: 15


  # --------------------------------------------------
  # Dahua IP Camera
  #
  # Primary fall detector.
  # --------------------------------------------------
  - id: dahua

    label:
      Dahua IP Camera

    type:
      rtsp

    enabled: true

    ai_enabled: true

    fall_detection: true

    # Primary temporal fall camera.
    temporal_fall: true

    face_recognition: false

    face_enrollment: false

    url:
      ${DAHUA_RTSP_URL}

    transport:
      tcp

    # OpenCV/FFmpeg 내부 큐 대신 GStreamer appsink(max-buffers=1)를 사용해
    # 처리 중 밀린 과거 프레임을 버리고 최신 프레임만 유지한다.
    backend:
      gstreamer

    codec:
      h264

    latency_ms:
      100

    # AI 입력과 개발용 표시에 1080p 전체 디코드 결과는 필요하지 않다.
    # 카메라는 메인스트림(1920x1080)을 유지하되 Pi5 내부에서 960x540으로 축소한다.
    decode_width:
      960

    decode_height:
      540

    # Dahua는 사람 수와 무관하게 GRU 시간축과 같은 10 FPS로 전송한다.
    # 640x360/JPEG70보다 선명하게 하되 MJPEG 전송 큐 누적은 줄인다.
    stream_width:
      960

    stream_height:
      540

    stream_fps:
      10

    jpeg_quality:
      80

    # OpenCV fallback에서도 가능한 저지연 옵션을 사용한다.
    low_latency: true
