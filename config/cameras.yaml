server:
  host: 0.0.0.0
  port: 8080
  stream_width: 640
  stream_height: 360
  stream_fps: 15
  jpeg_quality: 70

mqtt:
  enabled: true
  host: 192.168.1.10
  port: 1883
  topic_events: home/vision/events
  topic_status_prefix: home/vision/status
  status_interval_seconds: 5

inference:
  backend: ncnn
  model: models/yolo11n_ncnn_model
  input_size: 320
  confidence: 0.35
  nms_iou: 0.45
  threads: 4

face_recognition:
  enabled: true
  admin_token: ${FACE_ADMIN_TOKEN}
  detector_model: runtime/models/face/face_detection_yunet_2023mar.onnx
  recognizer_model: runtime/models/face/face_recognition_sface_2021dec.onnx
  database: data/faces.json
  analysis_fps: 0.5
  match_threshold: 0.45
  detection_width: 640
  min_face_size: 70
fall_detection:
  enabled: true
  model: models/yolo11n-pose_ncnn_model
  input_size: 320
  confidence: 0.35
  nms_iou: 0.45
  threads: 2
  analysis_fps: 1.5
  keypoint_confidence: 0.25
  transition_window: 3.0
  confirm_seconds: 1.2
  recovery_seconds: 2.0


cameras:
  - id: cam3
    label: Camera Module 3
    type: picamera2
    enabled: true
    ai_enabled: true
    analysis_fps: 5
    fall_detection: true
    face_enrollment: true
    width: 960
    height: 540
    fps: 30

  - id: webcam
    label: ABKO APC720 Webcam
    type: v4l2
    enabled: true
    ai_enabled: true
    analysis_fps: 4
    fall_detection: true
    face_enrollment: true
    device: /dev/v4l/by-id/usb-SunplusIT_Inc_ABKO_APC720_HD_WEBCAM_N2020120301-video-index0
    input_format: MJPG
    width: 1280
    height: 720
    fps: 30

  - id: dahua
    label: Dahua IP Camera
    type: rtsp
    enabled: true
    ai_enabled: true
    analysis_fps: 4
    fall_detection: true
    url: ${DAHUA_RTSP_URL}
    transport: tcp

