<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스마트홈</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body { font-family: sans-serif; background:#1a1a1a; color:#eee; margin:0; padding:20px; }
  h1 { font-size:20px; margin:0 0 16px; }
  #now { font-size:13px; color:#999; font-weight:400; margin-left:8px; }
  .room { margin-bottom:28px; }
  .room h2 { font-size:15px; color:#bbb; margin:0 0 10px; padding-bottom:6px; border-bottom:1px solid #333; }
  .cards { display:flex; flex-wrap:wrap; gap:12px; }
  .card { background:#2a2a2a; border-radius:10px; padding:14px 18px; min-width:130px; flex:1; }
  .card.on { background:#1e3a2a; border:1px solid #4ade80; }
  .card.open { background:#3a2a1e; border:1px solid #fb923c; }
  .card.lit { background:#3a3a1e; border:1px solid #facc15; }
  .card.cool { background:#1e2a3a; border:1px solid #60a5fa; }
  .card.alert { background:#3a1e1e; border:1px solid #f87171; }
  .card.none { background:#232323; border:1px dashed #3a3a3a; }
  .card.none .value { color:#555; }
  .label { font-size:12px; color:#999; }
  .value { font-size:26px; font-weight:600; margin-top:4px; }
  .time { font-size:11px; color:#666; margin-top:6px; }
  #chartBox { position:relative; height:320px; background:#2a2a2a; border-radius:10px; padding:10px; margin-top:20px; }
</style>
</head>
<body>

<h1>스마트홈 모니터 <span id="now"></span></h1>
<div id="rooms"></div>
<div id="chartBox"><canvas id="chart"></canvas></div>

<script>
let META = { rooms: [], metrics: [] };
let METRIC_BY_ID = {};

// 방마다 항상 보여줄 항목 (데이터가 없어도 빈 카드로 표시)
const ROOM_LAYOUT = {
  entrance:   { sensors: ["door"],
                devices: ["light"] },
  livingroom: { sensors: ["motion", "temperature", "humidity", "brightness"],
                devices: ["light", "aircon", "curtain"] },
  kitchen:    { sensors: ["motion", "temperature", "humidity", "gas", "gas_level"],
                devices: ["alarm"] },
  bathroom:   { sensors: ["motion", "temperature", "humidity"],
                devices: ["light", "fan"] }
};

const DEVICE_NAMES = { light:"조명", aircon:"에어컨", curtain:"커튼", fan:"환풍기", alarm:"경보" };
const DEVICE_NAMES_BY_ROOM = { kitchen: { alarm: "부저" } };

const METRIC_NAMES_FALLBACK = {
  motion:"움직임", temperature:"온도", humidity:"습도",
  brightness:"조도", gas:"가스", gas_level:"가스 농도", door:"현관문"
};

let lastCardsHtml = "";

async function loadMeta() {
  const res = await fetch("/api/meta");
  META = await res.json();
  METRIC_BY_ID = {};
  for (const m of META.metrics) METRIC_BY_ID[m.id] = m;
}

function fmtDateTime(ts) {
  return new Date(ts).toLocaleString("ko-KR",
    { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit", second:"2-digit" });
}
function fmtShort(ts) {
  return new Date(ts).toLocaleString("ko-KR", { hour:"2-digit", minute:"2-digit" });
}

function metricName(id) {
  const m = METRIC_BY_ID[id];
  if (m && m.name) return m.name;
  return METRIC_NAMES_FALLBACK[id] || id;
}

function deviceName(room, device) {
  const byRoom = DEVICE_NAMES_BY_ROOM[room];
  if (byRoom && byRoom[device]) return byRoom[device];
  return DEVICE_NAMES[device] || device;
}

function emptyCard(name) {
  return `<div class="card none"><div class="label">${name}</div><div class="value">—</div><div class="time">데이터 없음</div></div>`;
}

function sensorCard(s) {
  const m = METRIC_BY_ID[s.metric];
  let cls = "", val = s.value;
  if (s.metric === "door") { val = s.value === "CLOSED" ? "닫힘" : "열림"; if (s.value === "OPEN") cls = "open"; }
  else if (s.metric === "gas") { val = s.value === "ON" ? "감지!" : "정상"; if (s.value === "ON") cls = "alert"; }
  else if (m && m.numeric) {
    const digits = (s.metric === "humidity" || s.metric === "brightness" || s.metric === "gas_level") ? 0 : 1;
    val = Number(s.value).toFixed(digits) + (m.unit || "");
  }
  else if (s.value === "ON") cls = "on";
  return `<div class="card ${cls}"><div class="label">${metricName(s.metric)}</div><div class="value">${val}</div><div class="time">${fmtDateTime(s.ts)}</div></div>`;
}

function commandCard(c) {
  const name = deviceName(c.room, c.device);
  let cls = "", val;
  if (c.device === "curtain") { val = c.value === "OPEN" ? "열림" : "닫힘"; if (c.value === "OPEN") cls = "open"; }
  else {
    val = c.value === "ON" ? "켜짐" : "꺼짐";
    if (c.value === "ON") cls = c.device === "aircon" ? "cool" : c.device === "alarm" ? "alert" : "lit";
  }
  return `<div class="card ${cls}"><div class="label">${name}</div><div class="value">${val}</div><div class="time">${fmtDateTime(c.ts)}</div></div>`;
}

async function loadCards() {
  const res = await fetch("/api/latest");
  const data = await res.json();

  const sensorMap = {}, cmdMap = {};
  for (const s of data.sensors) sensorMap[s.room + "|" + s.metric] = s;
  for (const c of data.commands) cmdMap[c.room + "|" + c.device] = c;

  const roomNames = {};
  for (const r of META.rooms) roomNames[r.id] = r.name;

  let html = "";
  for (const roomId of Object.keys(ROOM_LAYOUT)) {
    const layout = ROOM_LAYOUT[roomId];
    html += `<div class="room"><h2>${roomNames[roomId] || roomId}</h2><div class="cards">`;

    for (const metric of layout.sensors) {
      const s = sensorMap[roomId + "|" + metric];
      html += s ? sensorCard(s) : emptyCard(metricName(metric));
    }
    for (const device of layout.devices) {
      const c = cmdMap[roomId + "|" + device];
      html += c ? commandCard(c) : emptyCard(deviceName(roomId, device));
    }

    html += `</div></div>`;
  }

  if (html !== lastCardsHtml) {
    document.getElementById("rooms").innerHTML = html;
    lastCardsHtml = html;
  }
}

// 그래프 선 색: 거실=빨강, 화장실=파랑, 부엌=초록
const COLORS = { livingroom:"#f87171", bathroom:"#60a5fa", kitchen:"#4ade80" };
let chart = null;

async function loadChart() {
  const series = [];
  for (const room of META.rooms) {
    if (!COLORS[room.id]) continue;
    series.push({ room:room.id, metric:"temperature", label:`${room.name} 온도`, color:COLORS[room.id], axis:"yTemp", dash:[] });
    series.push({ room:room.id, metric:"humidity",    label:`${room.name} 습도`, color:COLORS[room.id], axis:"yHumi", dash:[6,4] });
  }

  const results = await Promise.all(
    series.map(s => fetch(`/api/history/${s.room}/${s.metric}`).then(r => r.json()))
  );

  // 1) 모든 시각을 모아서 가로축 만들기 (1분 단위로 묶음)
  const bucket = ts => Math.floor(new Date(ts).getTime() / 60000);
  const allKeys = new Set();
  const maps = results.map(rows => {
    const m = new Map();
    for (const d of rows) {
      const k = bucket(d.ts);
      m.set(k, d.value);     // 같은 분이면 마지막 값 사용
      allKeys.add(k);
    }
    return m;
  });

  const keys = [...allKeys].sort((a, b) => a - b);
  const labels = keys.map(k => fmtShort(k * 60000));

  // 2) 각 선은 자기 시각 자리에만 점을 찍음
  const datasets = [];
  series.forEach((s, i) => {
    if (maps[i].size === 0) return;
    datasets.push({
      label: s.label,
      data: keys.map(k => maps[i].has(k) ? maps[i].get(k) : null),
      borderColor: s.color,
      borderDash: s.dash,
      yAxisID: s.axis,
      tension: 0.3,
      pointRadius: 0,
      spanGaps: true
    });
  });

  if (chart) {
    chart.data.labels = labels;
    chart.data.datasets = datasets;
    chart.update("none");
    return;
  }

  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { labels, datasets },
    options: {
      animation: false,
      maintainAspectRatio: false,
      interaction: { mode:"index", intersect:false },
      scales: {
        x: { grid:{color:"#3a3a3a"}, ticks:{color:"#999", maxTicksLimit:8} },
        yTemp: { position:"left",  title:{display:true, text:"온도 (°C) — 실선", color:"#ccc"}, grid:{color:"#3a3a3a"}, ticks:{color:"#999"}, suggestedMin:15, suggestedMax:35 },
        yHumi: { position:"right", title:{display:true, text:"습도 (%) — 점선", color:"#ccc"}, grid:{drawOnChartArea:false}, ticks:{color:"#999"}, suggestedMin:30, suggestedMax:100 }
      },
      plugins: { legend:{ labels:{color:"#eee"} } }
    }
  });
}

function updateNow() {
  document.getElementById("now").textContent = new Date().toLocaleString("ko-KR",
    { year:"numeric", month:"long", day:"numeric", weekday:"short", hour:"2-digit", minute:"2-digit" });
}

async function refresh() {
  try {
    await loadCards();
    await loadChart();
    updateNow();
  } catch (e) {
    console.error("갱신 실패:", e);
  }
}
loadMeta().then(() => { refresh(); setInterval(refresh, 3000); });
</script>

<script src="/static/fall_notice.js" defer></script>
</body>
</html>
