<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Vision 개발 대시보드</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0f16; --panel:#151b25; --line:#293345; --text:#eef3fb; --muted:#8f9bad; --green:#36d17c; --red:#ff6374; --blue:#6aa9ff; --orange:#ffbd59; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
    header { padding:22px 26px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    h1 { font-size:21px; margin:0; }
    .summary { color:var(--muted); }
    main { padding:22px; max-width:1600px; margin:auto; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:18px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
    .card-head { padding:12px 14px; display:flex; justify-content:space-between; align-items:center; }
    .name { font-weight:700; }
    .badge { padding:3px 9px; border-radius:99px; background:#303847; color:var(--muted); font-size:12px; }
    .badge.online { background:rgba(54,209,124,.15); color:var(--green); }
    .badge.person { background:rgba(255,99,116,.15); color:var(--red); }
    .badge.object { background:rgba(255,189,89,.15); color:var(--orange); }
    .card.fall { border-color:var(--red); box-shadow:0 0 0 1px rgba(255,99,116,.4); }
    .badge.fall { background:rgba(255,99,116,.24); color:#ff8b98; font-weight:700; }
    .stream { width:100%; aspect-ratio:16/9; object-fit:contain; display:block; background:#05070a; }
    .meta { padding:10px 14px 14px; color:var(--muted); font-size:13px; min-height:44px; }
    .events { margin-top:22px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
    .events h2 { margin:0 0 12px; font-size:17px; }
    .events h2 small { color:var(--muted); font-size:12px; font-weight:400; margin-left:8px; }
    #event-list { display:grid; gap:8px; }
    .event { display:flex; gap:12px; padding:9px 11px; background:#101620; border-radius:8px; }
    .event time { color:var(--muted); min-width:90px; }
    .event strong { color:var(--blue); }
    .face-admin { margin-top:22px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
    .face-admin h2 { margin:0 0 12px; font-size:17px; }
    .face-admin h2 small { color:var(--muted); font-size:12px; font-weight:400; margin-left:8px; }
    .face-form { display:grid; grid-template-columns:minmax(140px,180px) minmax(110px,140px) minmax(180px,1fr) auto; gap:9px; margin-bottom:10px; }
    input, select, button { border:1px solid var(--line); border-radius:8px; background:#101620; color:var(--text); padding:9px 11px; font:inherit; }
    button { cursor:pointer; background:#245da8; border-color:#3271c6; }
    button:disabled { opacity:.6; cursor:wait; }
    button.danger { background:#51212a; border-color:#7b2c38; padding:5px 10px; }
    .face-management { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
    .face-management summary { cursor:pointer; color:var(--muted); }
    .face-admin-form { display:grid; grid-template-columns:minmax(180px,1fr) auto; gap:9px; margin-top:10px; }
    #face-list { display:grid; gap:7px; margin-top:10px; }
    .face-row { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:#101620; border-radius:8px; }
    @media (max-width:800px) { .face-form{grid-template-columns:1fr 1fr} }
    @media (max-width:600px) { .grid{grid-template-columns:1fr} main{padding:12px} header{padding:16px} }
  </style>
</head>
<body>
  <header>
    <h1>AI Vision 개발 대시보드</h1>
    <div class="summary" id="summary">연결 확인 중…</div>
  </header>
  <main>
    <section class="grid">
      {% for camera_id in cameras %}
      <article class="card" id="card-{{ camera_id }}">
        <div class="card-head">
          <span class="name" id="name-{{ camera_id }}">{{ camera_id }}</span>
          <span class="badge" id="badge-{{ camera_id }}">대기</span>
        </div>
        <img class="stream" data-camera-id="{{ camera_id }}" src="/stream/{{ camera_id }}" alt="{{ camera_id }} stream">
        <div class="meta" id="meta-{{ camera_id }}">카메라 시작 중…</div>
      </article>
      {% endfor %}
    </section>
    <section class="face-admin">
      <h2>얼굴 등록 <small>Camera Module 3 또는 웹캠 · 등록에는 관리 코드 불필요</small></h2>
      <form id="face-form" class="face-form">
        <select id="face-camera" required>
          {% for camera_id in face_cameras %}
          <option value="{{ camera_id }}">{{ camera_id }}</option>
          {% endfor %}
        </select>
        <select id="face-view" required>
          <option value="front">정면</option>
          <option value="left">왼쪽</option>
          <option value="right">오른쪽</option>
        </select>
        <input id="face-name" maxlength="40" placeholder="등록할 이름" required>
        <button id="face-submit" type="submit">얼굴 등록</button>
      </form>
      <div id="face-status" class="summary">이름과 촬영 방향을 선택한 뒤 한 명만 카메라를 봐주세요.</div>
      <details class="face-management">
        <summary>등록자 목록·삭제 <small>관리 코드 필요</small></summary>
        <div class="face-admin-form">
          <input id="face-token" type="password" autocomplete="off" placeholder="관리 코드">
          <button id="face-admin-load" type="button">목록 불러오기</button>
        </div>
        <div id="face-admin-status" class="summary">삭제할 때 관리 코드를 입력하세요.</div>
        <div id="face-list"></div>
      </details>
    </section>
    <section class="events">
      <h2>최근 AI 이벤트 <small>상태 변화만 기록 · MQTT 전송</small></h2>
      <div id="event-list"><div class="summary">아직 이벤트가 없습니다.</div></div>
    </section>
  </main>
  <script>
    const streamTimers = new Map();
    let lastStreamRestart = Date.now();

    function restartStream(image, delay = 0) {
      const cameraId = image.dataset.cameraId;
      clearTimeout(streamTimers.get(cameraId));
      const timer = setTimeout(() => {
        image.src = `/stream/${encodeURIComponent(cameraId)}?connection=${Date.now()}`;
        streamTimers.delete(cameraId);
      }, delay);
      streamTimers.set(cameraId, timer);
    }

    function restartAllStreams() {
      const now = Date.now();
      if (now - lastStreamRestart < 1000) return;
      lastStreamRestart = now;
      document.querySelectorAll('.stream').forEach(image => restartStream(image));
    }

    document.querySelectorAll('.stream').forEach(image => {
      image.addEventListener('error', () => restartStream(image, 2000));
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') setTimeout(restartAllStreams, 250);
    });
    window.addEventListener('pageshow', restartAllStreams);
    window.addEventListener('focus', restartAllStreams);
    window.addEventListener('online', restartAllStreams);
    setInterval(() => {
      if (document.visibilityState === 'visible') restartAllStreams();
    }, 10 * 60 * 1000);

    const faceToken = document.getElementById('face-token');
    const faceStatus = document.getElementById('face-status');
    const faceAdminStatus = document.getElementById('face-admin-status');
    const faceList = document.getElementById('face-list');
    const viewLabels = {front:'정면', left:'왼쪽', right:'오른쪽', legacy:'기존 정면'};
    faceToken.value = sessionStorage.getItem('faceAdminToken') || '';

    async function faceRequest(url, options = {}) {
      const response = await fetch(url, {...options, cache:'no-store'});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || '요청에 실패했습니다.');
      return data;
    }

    async function faceAdminRequest(url, options = {}) {
      const token = faceToken.value.trim();
      const headers = {...(options.headers || {}), 'X-Face-Admin-Token': token};
      return faceRequest(url, {...options, headers});
    }

    function renderFaceList(people) {
      faceList.replaceChildren();
      if (!people.length) {
        const empty = document.createElement('span');
        empty.className = 'summary';
        empty.textContent = '등록된 사람이 없습니다.';
        faceList.append(empty);
        return;
      }
      for (const person of people) {
        const row = document.createElement('div');
        row.className = 'face-row';
        const name = document.createElement('span');
        const views = (person.views || []).map(view => viewLabels[view] || view).join(', ');
        name.textContent = views ? `${person.name} · ${views}` : person.name;
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'danger';
        button.textContent = '삭제';
        button.addEventListener('click', async () => {
          if (!confirm(`${person.name} 등록을 삭제할까요?`)) return;
          try {
            await faceAdminRequest(`/api/faces/${encodeURIComponent(person.id)}`, {method:'DELETE'});
            faceAdminStatus.textContent = `${person.name} 등록을 삭제했습니다.`;
            await refreshFaces();
          } catch (error) {
            faceAdminStatus.textContent = error.message;
          }
        });
        row.append(name, button);
        faceList.append(row);
      }
    }

    async function refreshFaces() {
      if (!faceToken.value.trim()) {
        faceAdminStatus.textContent = '목록 확인과 삭제에는 관리 코드가 필요합니다.';
        renderFaceList([]);
        return;
      }
      sessionStorage.setItem('faceAdminToken', faceToken.value.trim());
      try {
        const data = await faceAdminRequest('/api/faces');
        faceAdminStatus.textContent = data.enabled ? `등록자 ${data.people.length}명` : (data.error || '얼굴 인식 비활성');
        renderFaceList(data.people);
      } catch (error) {
        faceAdminStatus.textContent = error.message;
        renderFaceList([]);
      }
    }

    document.getElementById('face-admin-load').addEventListener('click', refreshFaces);
    faceToken.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        refreshFaces();
      }
    });
    document.getElementById('face-form').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('face-submit');
      const cameraId = document.getElementById('face-camera').value;
      const name = document.getElementById('face-name').value.trim();
      const view = document.getElementById('face-view').value;
      button.disabled = true;
      button.textContent = '얼굴 수집 중…';
      faceStatus.textContent = `한 명만 카메라를 ${viewLabels[view]} 방향으로 봐주세요.`;
      try {
        const person = await faceRequest('/api/faces/enroll', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({camera_id:cameraId, name, view}),
        });
        faceStatus.textContent = `${person.name} ${viewLabels[person.view]} 등록 완료 · 유효 사진 ${person.samples}장 · 다음 방향도 같은 이름으로 등록하세요.`;
        if (faceToken.value.trim()) await refreshFaces();
      } catch (error) {
        faceStatus.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = '얼굴 등록';
      }
    });

    async function refreshStatus() {
      const response = await fetch('/api/status', {cache:'no-store'});
      const data = await response.json();
      const online = data.cameras.filter(camera => camera.online).length;
      document.getElementById('summary').textContent = `${online}/${data.cameras.length} 카메라 온라인 · MQTT ${data.mqtt_connected ? '연결' : '대기'} · 등록자 ${data.registered_people}명`;
      for (const camera of data.cameras) {
        document.getElementById(`name-${camera.camera_id}`).textContent = camera.label;
        const card = document.getElementById(`card-${camera.camera_id}`);
        const badge = document.getElementById(`badge-${camera.camera_id}`);
        const hasObjects = camera.object_count > 0;
        const isFall = camera.fall_state === 'confirmed';
        const isSuspected = camera.fall_state === 'suspected';
        card.classList.toggle('fall', isFall);
        badge.className = 'badge' + (isFall ? ' fall' : isSuspected ? ' object' : camera.person_count ? ' person' : camera.online ? ' online' : '');
        badge.textContent = isFall ? '낙상 감지'
          : isSuspected ? '낙상 의심'
          : camera.person_count ? `사람 ${camera.person_count}명`
          : camera.online ? '온라인' : '오프라인';
        const poseSummary = camera.pose_enabled ? ` · 자세: ${camera.pose_state} · 낙상: ${camera.fall_state}` : '';
        const baseMeta = `${camera.source_type} · ${camera.ai_enabled ? 'AI 분석' : '감시 전용'} · ${camera.capture_fps} FPS${poseSummary}`;
        const faceSummary = camera.known_faces
          ? ` · 등록자 ${camera.known_faces}명`
          : camera.unknown_faces ? ` · 미등록 얼굴 ${camera.unknown_faces}명` : '';
        document.getElementById(`meta-${camera.camera_id}`).textContent =
          camera.error || `${baseMeta}${faceSummary}`;
      }
    }
    async function refreshEvents() {
      const response = await fetch('/api/events', {cache:'no-store'});
      const events = await response.json();
      const list = document.getElementById('event-list');
      if (!events.length) return;
      list.innerHTML = events.slice(0, 15).map(event => {
        const time = new Date(event.timestamp).toLocaleTimeString('ko-KR');
        const eventLabels = {
          person_detected: '사람 감지',
          person_cleared: '사람 없음',
          fall_suspected: '낙상 의심',
          fall_confirmed: '낙상 감지 · 위험',
          fall_cleared: '낙상 상태 해제',
        };
        const label = eventLabels[event.event_type] || event.event_type;
        const confidence = event.confidence == null ? '' : ` · ${(event.confidence * 100).toFixed(0)}%`;
        return `<div class="event"><time>${time}</time><strong>${event.camera_id}</strong><span>${label}${confidence}</span></div>`;
      }).join('');
    }
    async function refresh() {
      try { await Promise.all([refreshStatus(), refreshEvents()]); } catch (error) { document.getElementById('summary').textContent = '서버 연결 재시도 중…'; }
    }
    refresh();
    setInterval(refresh, 1500);
  </script>
</body>
</html>
