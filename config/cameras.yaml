server:
  host: 0.0.0.0
  port: 8080

  # 사용자에게 보여주는 MJPEG 화면
  stream_width: 640
  stream_height: 360
  stream_fps: 15
  jpeg_quality: 70


mqtt:
  enabled: true
  host: 192.168.1.10
  port: 1883

  topic_events: home/vision/events
  topic_status_prefix: home/vision/status

  status_interval_seconds: 5


face_recognition:
  enabled: true

  admin_token: ${FACE_ADMIN_TOKEN}

  detector_model:
    runtime/models/face/face_detection_yunet_2023mar.onnx

  recognizer_model:
    runtime/models/face/face_recognition_sface_2021dec.onnx

  database:
    data/faces.json

  # 움직이는 얼굴 박스가 따라오도록 5 Hz로 분석한다.
  analysis_fps: 5

  match_threshold: 0.45
  detection_width: 640
  min_face_size: 70

  # 한 번의 안내 촬영에서 정면/좌/우 특징을 자동 수집한다.
  enrollment_seconds: 10
  enrollment_sample_interval: 0.18
  enrollment_min_samples_per_view: 3
  enrollment_yaw_threshold: 0.12
  enrollment_max_yaw: 0.65
  enrollment_min_sharpness: 35


fall_detection:
  enabled: true

  # 운영 경로: Hailo Model Zoo v2.15 YOLOv8s-Pose -> EdgeFallKit.
  # YOLO11 NCNN, RuleFallDetector, B76 GRU는 실행하지 않는다.
  backend: hailo_edgefall

  model:
    runtime/models/yolov8s_pose_v2_15_h8.hef

  hailo_postprocess:
    /usr/local/hailo/resources/so/libyolov8pose_postprocess.so

  hailo_whole_buffer:
    /usr/lib/aarch64-linux-gnu/hailo/tappas/post_processes/cropping_algorithms/libwhole_buffer.so

  hailo_timeout_seconds: 3.0

  # 대시보드 연결 여부와 무관하게 상시 분석하고 표준 fall_* 이벤트를
  # Pi4 MQTT 브로커로 전송한다.
  edgefall:
    enabled: true
    publish_mqtt: true
    keypoint_confidence: 0.25
    library: runtime/native/libedgefall_shadow.so

  # Hailo post-process 단계에서 person 후보를 버리지 않고 EdgeFall의
  # 관절 유효성 검사를 적용한다.
  confidence: 0.0

  analysis_fps: 15

  keypoint_confidence: 0.25

cameras:

  # --------------------------------------------------
  # Camera Module 3
  #
  # Face enrollment / recognition station and secondary view.
  # --------------------------------------------------
  - id: cam3

    label:
      Camera Module 3

    type:
      picamera2

    enabled: true

    ai_enabled: true

    fall_detection: false

    face_recognition: true

    face_enrollment: true

    width: 960
    height: 540

    # 화면용으로 15 FPS면 충분.
    fps: 15


  # --------------------------------------------------
  # Dahua IP Camera
  #
  # Primary fall detector.
  # --------------------------------------------------
  - id: dahua

    label:
      Dahua IP Camera

    type:
      rtsp

    enabled: true

    ai_enabled: true

    fall_detection: true

    face_recognition: false

    face_enrollment: false

    url:
      ${DAHUA_RTSP_URL}

    transport:
      tcp

    # OpenCV/FFmpeg 내부 큐 대신 GStreamer appsink(max-buffers=1)를 사용해
    # 처리 중 밀린 과거 프레임을 버리고 최신 프레임만 유지한다.
    backend:
      gstreamer

    codec:
      h264

    latency_ms:
      100

    # AI 입력과 개발용 표시에 1080p 전체 디코드 결과는 필요하지 않다.
    # 카메라는 메인스트림(1920x1080)을 유지하되 Pi5 내부에서 960x540으로 축소한다.
    decode_width:
      960

    decode_height:
      540

    # Dahua는 사람 수와 무관하게 GRU 시간축과 같은 10 FPS로 전송한다.
    # 640x360/JPEG70보다 선명하게 하되 MJPEG 전송 큐 누적은 줄인다.
    stream_width:
      960

    stream_height:
      540

    stream_fps:
      10

    jpeg_quality:
      80

    # OpenCV fallback에서도 가능한 저지연 옵션을 사용한다.
    low_latency: true
