server:
  host: 0.0.0.0
  port: 8080

  # 사용자에게 보여주는 MJPEG 화면
  stream_width: 640
  stream_height: 360
  stream_fps: 15
  jpeg_quality: 70


mqtt:
  enabled: true
  host: 192.168.1.10
  port: 1883

  topic_events: home/vision/events
  topic_status_prefix: home/vision/status

  status_interval_seconds: 5


# Legacy object detector configuration.
#
# 현재 fall runtime에서는 별도 object detector를
# 생성하지 않는다.
#
# Pose model이 person bbox와 keypoint를
# 동시에 제공한다.
inference:
  backend: ncnn
  model: models/yolo11n_ncnn_model

  input_size: 320
  confidence: 0.35
  nms_iou: 0.45
  threads: 4


face_recognition:
  enabled: true

  admin_token: ${FACE_ADMIN_TOKEN}

  detector_model:
    runtime/models/face/face_detection_yunet_2023mar.onnx

  recognizer_model:
    runtime/models/face/face_recognition_sface_2021dec.onnx

  database:
    data/faces.json

  # 얼굴 인식은 계속 실행할 필요 없음.
  analysis_fps: 0.5

  match_threshold: 0.45
  detection_width: 640
  min_face_size: 70


fall_detection:
  enabled: true

  # 현재 NCNN 320 baseline.
  #
  # 640/960 비교 후 최종 변경 예정.
  model:
    models/yolo11n-pose_ncnn_model

  input_size: 320

  # GRU 학습 pose cache와 맞추기 위해
  # 기존 0.35 대신 우선 0.10 사용.
  confidence: 0.10

  nms_iou: 0.45

  # Pi5 benchmark에서 4 thread가
  # 가장 빨랐음.
  threads: 4

  # 최종 GRU temporal sampling rate.
  analysis_fps: 10

  keypoint_confidence: 0.25

  # 아래 값은 현재 RuleFallDetector fallback용.
  transition_window: 3.0
  confirm_seconds: 1.2
  recovery_seconds: 2.0


cameras:

  # --------------------------------------------------
  # Camera Module 3
  #
  # Secondary view.
  # 현재 AI 연산하지 않음.
  # --------------------------------------------------
  - id: cam3

    label:
      Camera Module 3

    type:
      picamera2

    enabled: true

    ai_enabled: false

    fall_detection: false

    face_recognition: false

    face_enrollment: false

    width: 960
    height: 540

    # 화면용으로 15 FPS면 충분.
    fps: 15


  # --------------------------------------------------
  # ABKO APC720
  #
  # Face station 전용.
  # --------------------------------------------------
  - id: webcam

    label:
      ABKO APC720 Webcam

    type:
      v4l2

    enabled: true

    ai_enabled: false

    fall_detection: false

    face_recognition: true

    face_enrollment: true

    device:
      /dev/v4l/by-id/usb-SunplusIT_Inc_ABKO_APC720_HD_WEBCAM_N2020120301-video-index0

    input_format:
      MJPG

    width: 1280
    height: 720

    # 장치는 30 FPS 가능하지만
    # face station에는 15 FPS면 충분.
    fps: 15


  # --------------------------------------------------
  # Dahua IP Camera
  #
  # Primary fall detector.
  # --------------------------------------------------
  - id: dahua

    label:
      Dahua IP Camera

    type:
      rtsp

    enabled: true

    ai_enabled: true

    fall_detection: true

    face_recognition: false

    face_enrollment: false

    url:
      ${DAHUA_RTSP_URL}

    transport:
      tcp
